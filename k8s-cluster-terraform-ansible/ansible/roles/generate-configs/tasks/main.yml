---
- name: Create kubeconfig directory
  ansible.builtin.file:
    path: "{{ kubeconfig_dir }}"
    state: directory
    mode: "0700"

- name: Build kubeconfig definitions for control plane components and kube-proxy
  ansible.builtin.set_fact:
    kubeconfigs:
      - {name: kube-proxy, user: "system:kube-proxy", cert: kube-proxy, server: "https://{{ api_server_private_ip }}:6443"}
      - {name: kube-controller-manager, user: "system:kube-controller-manager", cert: kube-controller-manager, server: "https://127.0.0.1:6443"}
      - {name: kube-scheduler, user: "system:kube-scheduler", cert: kube-scheduler, server: "https://127.0.0.1:6443"}
      - {name: admin, user: admin, cert: admin, server: "https://127.0.0.1:6443"}

- name: Add one kubeconfig per worker (kubelet)
  ansible.builtin.set_fact:
    kubeconfigs: >-
      {{ kubeconfigs + [{'name': item, 'user': 'system:node:' ~ item, 'cert': item,
                         'server': 'https://' ~ api_server_private_ip ~ ':6443'}] }}
  loop: "{{ groups['workers'] }}"

- name: Generate kubeconfig files
  ansible.builtin.template:
    src: kubeconfig.j2
    dest: "{{ kubeconfig_dir }}/{{ item.name }}.kubeconfig"
    mode: "0600"
  loop: "{{ kubeconfigs }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.server }}"

- name: Generate (or read existing) data encryption key
  ansible.builtin.set_fact:
    encryption_key: "{{ lookup('ansible.builtin.password', pki_dir ~ '/encryption.key', chars=['ascii_letters', 'digits'], length=32) }}"
  no_log: true

- name: Generate encryption-config.yaml
  ansible.builtin.template:
    src: encryption-config.yaml.j2
    dest: "{{ artifacts_dir }}/encryption-config.yaml"
    mode: "0600"
