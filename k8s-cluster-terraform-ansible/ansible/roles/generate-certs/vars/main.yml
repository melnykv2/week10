---
ca_days: 3650
cert_days: 365
key_size: 2048

# front-proxy-ca signs only the aggregation layer's client cert, so a regular cluster
# client cert can never be used to impersonate users through an extension API server.
certificate_authorities:
  - {name: ca, cn: Kubernetes CA}
  - {name: front-proxy-ca, cn: Kubernetes Front Proxy CA}

static_certificates:
  - name: admin
    cn: admin
    org: system:masters
    usage: clientAuth

  - name: kube-controller-manager
    cn: system:kube-controller-manager
    org: system:kube-controller-manager
    usage: clientAuth

  - name: kube-scheduler
    cn: system:kube-scheduler
    org: system:kube-scheduler
    usage: clientAuth

  - name: kube-proxy
    cn: system:kube-proxy
    org: system:node-proxier
    usage: clientAuth

  - name: kube-api-server
    cn: kubernetes
    org: Kubernetes
    usage: serverAuth, clientAuth
    dns:
      - kubernetes
      - kubernetes.default
      - kubernetes.default.svc
      - kubernetes.default.svc.cluster
      - "kubernetes.default.svc.{{ cluster_domain }}"
      - localhost
    dns_extra: "{{ groups['controllers'] }}"
    ips: "{{ ['127.0.0.1', kubernetes_service_ip]
             + groups['controllers'] | map('extract', hostvars, 'private_ip') | list
             + groups['controllers'] | map('extract', hostvars, 'ansible_host') | list }}"

  - name: service-accounts
    cn: service-accounts
    org: Kubernetes
    usage: clientAuth

  # Client cert kube-apiserver presents to aggregated API servers (metrics-server)
  - name: front-proxy-client
    cn: front-proxy-client
    org: Kubernetes
    usage: clientAuth
    ca: front-proxy-ca
